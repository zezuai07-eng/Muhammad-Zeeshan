    <script>
      // Universal Live Fallback: If static host (Cloudflare) serves uncompiled root index.html
      (function() {
        var h = window.location.hostname;
        var isLiveProd = h === 'kashpalenterprises.com' || h.endsWith('.pages.dev') || h.endsWith('.workers.dev');
        if (isLiveProd) {
          var checkMounted = function() {
            var root = document.getElementById('root');
            if (root && root.children.length === 0) {
              console.log('[Kashpal] Loading pre-compiled production bundle...');
              if (!document.querySelector('link[href*="index.css"]')) {
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = '/assets/index.css';
                document.head.appendChild(link);
              }
              var s = document.createElement('script');
              s.type = 'module';
              s.crossOrigin = 'anonymous';
              s.src = '/assets/app.js';
              document.body.appendChild(s);
            }
          };
          if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(checkMounted, 50);
          } else {
            window.addEventListener('DOMContentLoaded', function() { setTimeout(checkMounted, 50); });
          }
        }
      })();
    </script>
