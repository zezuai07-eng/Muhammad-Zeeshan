<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE685" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050B18" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />

  <!-- Inner Geometric Cadastral Pattern -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" />
  <circle cx="256" cy="230" r="110" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.2" />

  <!-- Compass / Cadastral Cross Lines -->
  <line x1="256" y1="90" x2="256" y2="370" stroke="#D4AF37" stroke-width="2" opacity="0.25" stroke-dasharray="4 4" />
  <line x1="116" y1="230" x2="396" y2="230" stroke="#D4AF37" stroke-width="2" opacity="0.25" stroke-dasharray="4 4" />

  <!-- Golden Shield / Crest Center -->
  <g filter="url(#glow)">
    <!-- Map Location Pin Outline & Shield -->
    <path d="M256 110 C190 110 140 160 140 226 C140 310 240 380 256 394 C272 380 372 310 372 226 C372 160 322 110 256 110 Z" fill="#0B132B" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Inner Map Roads / Grid Lines -->
    <path d="M190 200 L322 200 M175 240 L337 240 M210 150 L210 290 M256 130 L256 310 M302 150 L302 290" fill="none" stroke="#D4AF37" stroke-width="4" opacity="0.45" />

    <!-- Center Building / Luxury Tower Icon -->
    <polygon points="256,155 285,185 285,285 227,285 227,185" fill="url(#goldGrad)" />
    <!-- Building Windows -->
    <rect x="238" y="200" width="10" height="12" rx="2" fill="#0B132B" />
    <rect x="264" y="200" width="10" height="12" rx="2" fill="#0B132B" />
    <rect x="238" y="222" width="10" height="12" rx="2" fill="#0B132B" />
    <rect x="264" y="222" width="10" height="12" rx="2" fill="#0B132B" />
    <rect x="238" y="244" width="10" height="12" rx="2" fill="#0B132B" />
    <rect x="264" y="244" width="10" height="12" rx="2" fill="#0B132B" />
    <rect x="250" y="265" width="12" height="20" rx="1" fill="#0B132B" />
  </g>

  <!-- Typography / Brand Badge Below -->
  <text x="256" y="445" font-family="'Cinzel', 'Plus Jakarta Sans', serif, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">LDA CITY</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="3">KASHPAL ENTERPRISES</text>
</svg>
